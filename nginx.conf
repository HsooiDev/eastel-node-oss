# Eastel Next.js — STAGING ONLY; reviewed template, not an installed configuration.
# Never bind eastel.site/www here without a separately approved production configuration.
# Review Hostinger's effective proxy first (some plans use LiteSpeed, not this file).
# Install/reload only through the approved hosting workflow after nginx -t.
# Cloudflare Access is recommended; public previews still retain noindex/no-store.
# See docs/INFRA_SEO_ISOLATION.md and infra/nginx/production.conf.example.

server {
    listen 80;
    server_name staging.example.test;
    if ($host != staging.example.test) { return 421; }
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store, max-age=0" always;
    return 308 https://staging.example.test$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.example.test;
    if ($host != staging.example.test) { return 421; }

    ssl_certificate     /etc/ssl/certs/eastel.site.pem;
    ssl_certificate_key /etc/ssl/private/eastel.site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Restore visitors only from verified Cloudflare peers. Direct clients cannot
    # choose their limiter identity through CF-Connecting-IP or forwarded headers.
    # Official ranges checked 2026-10-10: https://www.cloudflare.com/ips/
    # Refresh against the official lists before deployment; requires realip module.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    # Defense in depth for ALL responses, including static files, errors and redirects.
    # Keep add_header at server scope: a child add_header would shadow these on older Nginx.
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header Cache-Control;
    proxy_hide_header CDN-Cache-Control;
    proxy_hide_header Cloudflare-CDN-Cache-Control;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    expires off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    client_max_body_size 10M;

    # No shared proxy cache. Next.js controls rendering and its own response cache.
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite the client-supplied forwarding chain (preserves trusted-IP policy).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    # Fixed, allowlisted hostname; never forward an unvalidated Host to Next.js.
    proxy_set_header Host staging.example.test;

    # Staging static responses intentionally retain no-store and noindex.
    location = /favicon.ico {
        root /home/deploy/eastel-website_nodejs/public;
        access_log off;
        log_not_found off;
    }
    location = /manifest.json {
        root /home/deploy/eastel-website_nodejs/public;
        access_log off;
    }
    # These historical names need Next's canonical AVIF/SVG rewrites and MIME.
    # Case-insensitive, finite exceptions also cover the existing lowercase JPG.
    location ~* ^/images/(ASP-Licence\.jpg|Eastel-logo-white-100x100\.png|eastel-logo-dark1\.svg)$ {
        proxy_pass http://127.0.0.1:3000;
    }
    location /images/ {
        alias /home/deploy/eastel-website_nodejs/public/images/;
        access_log off;
    }
    location /fonts/ {
        alias /home/deploy/eastel-website_nodejs/public/fonts/;
        access_log off;
    }
    location /_next/static/ {
        alias /home/deploy/eastel-website_nodejs/.next/static/;
        access_log off;
    }
    # robots/sitemap MUST reach Next.js's environment-aware handlers.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host staging.example.test;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
